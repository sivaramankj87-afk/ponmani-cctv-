<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>PONMANI CCTV | Professional Quotation</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Orbitron:wght@500;600;700;800&display=swap" rel="stylesheet">

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    font-family:"Inter",sans-serif;
    min-height:100vh;
    background:
        radial-gradient(circle at 15% 20%, rgba(0,180,255,.14), transparent 30%),
        radial-gradient(circle at 85% 80%, rgba(0,100,255,.12), transparent 30%),
        #05070b;
    color:#fff;
    padding:35px 15px;
}

/* MAIN CONTAINER */

.container{
    width:100%;
    max-width:1150px;
    margin:auto;
}

/* HEADER */

.header{
    display:flex;
    justify-content:space-between;
    align-items:center;
    margin-bottom:25px;
    gap:20px;
}

.brand{
    display:flex;
    align-items:center;
    gap:15px;
}

.logo{
    width:55px;
    height:55px;
    border-radius:16px;

    display:flex;
    align-items:center;
    justify-content:center;

    background:linear-gradient(135deg,#00c6ff,#0066ff);

    box-shadow:
        0 0 25px rgba(0,174,255,.35);

    font-size:24px;
    font-weight:800;
}

.brand h1{
    font-family:"Orbitron",sans-serif;
    font-size:20px;
    letter-spacing:1px;
}

.brand span{
    display:block;
    color:#8c9aaa;
    font-size:12px;
    margin-top:3px;
}

.status{
    padding:10px 15px;
    border-radius:30px;
    border:1px solid rgba(0,255,180,.2);
    background:rgba(0,255,180,.05);
    color:#5fffc7;
    font-size:13px;
}

/* CARD */

.card{
    background:rgba(13,18,27,.78);
    border:1px solid rgba(255,255,255,.08);
    border-radius:24px;
    padding:28px;

    box-shadow:
        0 20px 70px rgba(0,0,0,.4),
        inset 0 1px 0 rgba(255,255,255,.04);

    backdrop-filter:blur(20px);
}

/* SECTION */

.section{
    margin-bottom:28px;
}

.section-title{
    display:flex;
    align-items:center;
    gap:10px;
    margin-bottom:18px;
}

.section-title .number{
    width:30px;
    height:30px;
    border-radius:9px;

    display:flex;
    align-items:center;
    justify-content:center;

    background:rgba(0,174,255,.12);
    border:1px solid rgba(0,174,255,.25);

    color:#00c6ff;
    font-size:13px;
    font-weight:700;
}

.section-title h2{
    font-size:15px;
    letter-spacing:.5px;
}

/* FORM GRID */

.form-grid{
    display:grid;
    grid-template-columns:repeat(3,1fr);
    gap:15px;
}

.field{
    position:relative;
}

.field label{
    display:block;
    color:#8994a3;
    font-size:12px;
    margin-bottom:8px;
}

.field input,
.field textarea{
    width:100%;

    border:1px solid rgba(255,255,255,.08);
    outline:none;

    background:rgba(255,255,255,.035);
    color:white;

    padding:14px 15px;
    border-radius:12px;

    font-size:14px;

    transition:.25s;
}

.field textarea{
    resize:none;
    min-height:90px;
}

.field input:focus,
.field textarea:focus{
    border-color:#00aaff;
    box-shadow:0 0 0 3px rgba(0,170,255,.08);
}

/* PRODUCT INPUT */

.product-input-box{
    display:grid;
    grid-template-columns:1fr 130px 160px auto;
    gap:10px;
    align-items:end;
}

.product-input-box input{
    width:100%;
    padding:15px;

    border-radius:13px;
    border:1px solid rgba(255,255,255,.08);

    outline:none;

    background:#090e15;
    color:#fff;

    font-size:14px;
}

.product-input-box input:focus{
    border-color:#00b7ff;
}

/* BUTTON */

button{
    border:none;
    cursor:pointer;
    font-family:inherit;
}

.add-btn{
    padding:15px 20px;
    border-radius:13px;

    background:linear-gradient(135deg,#00b7ff,#0066ff);

    color:#fff;
    font-weight:700;

    box-shadow:
        0 10px 25px rgba(0,120,255,.2);

    transition:.25s;
}

.add-btn:hover{
    transform:translateY(-2px);
    box-shadow:
        0 14px 35px rgba(0,120,255,.35);
}

/* PRODUCT LIST */

.products{
    margin-top:20px;

    border:1px solid rgba(255,255,255,.07);
    border-radius:17px;
    overflow:hidden;
}

.product-head,
.product-row{
    display:grid;
    grid-template-columns:1fr 90px 130px 130px 45px;
    gap:10px;
    align-items:center;
}

.product-head{
    padding:13px 15px;
    background:rgba(255,255,255,.035);

    color:#768394;
    font-size:11px;
    text-transform:uppercase;
}

.product-row{
    padding:15px;
    border-top:1px solid rgba(255,255,255,.06);
    font-size:13px;
}

.product-name{
    font-weight:600;
}

.product-qty,
.product-price,
.product-total{
    color:#dce5ef;
}

.delete-btn{
    width:32px;
    height:32px;

    border-radius:9px;

    background:rgba(255,60,80,.08);
    color:#ff6878;

    transition:.2s;
}

.delete-btn:hover{
    background:#ff4055;
    color:white;
}

/* EMPTY */

.empty{
    text-align:center;
    padding:35px;
    color:#667181;
    font-size:13px;
}

/* TOTAL */

.summary{
    display:flex;
    justify-content:flex-end;
    margin-top:20px;
}

.summary-box{
    width:330px;

    background:rgba(255,255,255,.025);
    border:1px solid rgba(255,255,255,.07);

    border-radius:18px;
    padding:20px;
}

.summary-line{
    display:flex;
    justify-content:space-between;
    padding:8px 0;

    color:#9aa6b5;
    font-size:13px;
}

.summary-line strong{
    color:#fff;
}

.grand-total{
    border-top:1px solid rgba(255,255,255,.08);
    margin-top:10px;
    padding-top:15px;

    display:flex;
    justify-content:space-between;

    font-size:18px;
}

.grand-total span:last-child{
    color:#00c6ff;
    font-weight:800;
}

/* ACTIONS */

.actions{
    display:flex;
    justify-content:flex-end;
    gap:10px;
    margin-top:25px;
    flex-wrap:wrap;
}

.action-btn{
    padding:13px 20px;
    border-radius:12px;

    background:rgba(255,255,255,.05);
    border:1px solid rgba(255,255,255,.08);

    color:#dbe5f0;
    font-weight:600;

    transition:.2s;
}

.action-btn:hover{
    background:rgba(255,255,255,.09);
}

.primary{
    background:linear-gradient(135deg,#00b7ff,#0066ff);
    border:none;
    color:white;
}

/* QUOTATION NUMBER */

.quote-info{
    display:flex;
    justify-content:flex-end;
    margin-bottom:20px;
}

.quote-number{
    background:rgba(0,174,255,.06);
    border:1px solid rgba(0,174,255,.15);

    padding:12px 16px;
    border-radius:12px;

    font-size:12px;
    color:#9ba8b8;
}

.quote-number strong{
    color:#00c6ff;
}

/* TOAST */

.toast{
    position:fixed;
    right:25px;
    bottom:25px;

    padding:15px 20px;

    border-radius:12px;

    background:#111923;
    border:1px solid rgba(0,200,255,.2);

    box-shadow:0 15px 40px rgba(0,0,0,.4);

    color:#fff;

    transform:translateY(100px);
    opacity:0;

    transition:.35s;
}

.toast.show{
    transform:translateY(0);
    opacity:1;
}

/* MOBILE */

@media(max-width:800px){

    body{
        padding:20px 10px;
    }

    .card{
        padding:20px 15px;
        border-radius:18px;
    }

    .header{
        align-items:flex-start;
        flex-direction:column;
    }

    .form-grid{
        grid-template-columns:1fr;
    }

    .product-input-box{
        grid-template-columns:1fr;
    }

    .products{
        overflow-x:auto;
    }

    .product-head,
    .product-row{
        min-width:650px;
    }

    .summary{
        justify-content:stretch;
    }

    .summary-box{
        width:100%;
    }

    .actions{
        justify-content:stretch;
    }

    .action-btn{
        flex:1;
    }
}

/* PRINT */

@media print{

    body{
        background:white;
        color:black;
        padding:0;
    }

    .header,
    .actions,
    .product-input-box,
    .section-title .number,
    .toast{
        display:none !important;
    }

    .card{
        box-shadow:none;
        border:none;
        background:white;
        color:black;
    }

    .field input,
    .field textarea{
        color:black;
        background:white;
        border:1px solid #ddd;
    }

    .products{
        border:1px solid #ddd;
    }

    .product-head{
        background:#eee;
        color:#333;
    }

    .product-row{
        border-top:1px solid #ddd;
    }

    .summary-box{
        border:1px solid #ddd;
        color:black;
    }

    .summary-line,
    .product-qty,
    .product-price,
    .product-total{
        color:#333;
    }

    .grand-total span:last-child{
        color:#000;
    }
}

</style>
</head>

<body>

<div class="container">

    <!-- HEADER -->

    <div class="header">

        <div class="brand">

            <div class="logo">
                P
            </div>

            <div>
                <h1>PONMANI CCTV</h1>
                <span>SALES • SERVICE • SOLUTIONS</span>
            </div>

        </div>

        <div class="status">
            ● QUOTATION SYSTEM
        </div>

    </div>


    <div class="card">

        <!-- QUOTATION INFO -->

        <div class="quote-info">

            <div class="quote-number">
                QUOTATION NO:
                <strong id="quoteNumber"></strong>
            </div>

        </div>


        <!-- CUSTOMER -->

        <div class="section">

            <div class="section-title">

                <div class="number">01</div>

                <h2>CUSTOMER INFORMATION</h2>

            </div>


            <div class="form-grid">

                <div class="field">

                    <label>Customer Name</label>

                    <input
                        type="text"
                        id="customerName"
                        placeholder="Enter customer name"
                    >

                </div>


                <div class="field">

                    <label>Phone Number</label>

                    <input
                        type="tel"
                        id="phone"
                        placeholder="Enter phone number"
                    >

                </div>


                <div class="field">

                    <label>Location</label>

                    <input
                        type="text"
                        id="location"
                        placeholder="Enter location"
                    >

                </div>

            </div>

        </div>


        <!-- PRODUCTS -->

        <div class="section">

            <div class="section-title">

                <div class="number">02</div>

                <h2>PRODUCTS & SERVICES</h2>

            </div>


            <!-- ANYTHING CAN BE TYPED HERE -->

            <div class="product-input-box">

                <div class="field">

                    <label>Product / Service Name</label>

                    <input
                        type="text"
                        id="productName"
                        placeholder="Type anything... e.g. Camera, DVR, Installation"
                        onkeydown="handleEnter(event)"
                    >

                </div>


                <div class="field">

                    <label>Quantity</label>

                    <input
                        type="number"
                        id="quantity"
                        value="1"
                        min="1"
                    >

                </div>


                <div class="field">

                    <label>Price / Unit</label>

                    <input
                        type="number"
                        id="price"
                        placeholder="₹ 0"
                        min="0"
                    >

                </div>


                <button
                    class="add-btn"
                    onclick="addProduct()"
                >
                    + ADD ITEM
                </button>

            </div>


            <!-- PRODUCT LIST -->

            <div class="products">

                <div class="product-head">

                    <div>ITEM</div>
                    <div>QTY</div>
                    <div>UNIT PRICE</div>
                    <div>TOTAL</div>
                    <div></div>

                </div>


                <div id="productList">

                    <div class="empty" id="emptyMessage">
                        No products added yet.<br>
                        Type any product or service above.
                    </div>

                </div>

            </div>


            <!-- TOTAL -->

            <div class="summary">

                <div class="summary-box">

                    <div class="summary-line">

                        <span>Subtotal</span>

                        <strong>
                            ₹ <span id="subtotal">0.00</span>
                        </strong>

                    </div>


                    <div class="summary-line">

                        <span>GST (%)</span>

                        <input
                            id="gst"
                            type="number"
                            value="0"
                            min="0"
                            style="
                                width:70px;
                                padding:6px;
                                border-radius:7px;
                                border:1px solid rgba(255,255,255,.1);
                                background:#080d13;
                                color:white;
                            "
                            oninput="calculateTotal()"
                        >

                    </div>


                    <div class="summary-line">

                        <span>GST Amount</span>

                        <strong>
                            ₹ <span id="gstAmount">0.00</span>
                        </strong>

                    </div>


                    <div class="grand-total">

                        <span>GRAND TOTAL</span>

                        <span>
                            ₹ <span id="grandTotal">0.00</span>
                        </span>

                    </div>

                </div>

            </div>

        </div>


        <!-- NOTES -->

        <div class="section">

            <div class="section-title">

                <div class="number">03</div>

                <h2>ADDITIONAL NOTES</h2>

            </div>


            <div class="field">

                <textarea
                    id="notes"
                    placeholder="Enter installation details, warranty, delivery information, terms & conditions..."
                ></textarea>

            </div>

        </div>


        <!-- ACTIONS -->

        <div class="actions">

            <button
                class="action-btn"
                onclick="saveQuotation()"
            >
                💾 Save
            </button>


            <button
                class="action-btn"
                onclick="shareQuotation()"
            >
                📤 Share
            </button>


            <button
                class="action-btn"
                onclick="window.print()"
            >
                🖨️ Print / PDF
            </button>


            <button
                class="action-btn primary"
                onclick="generateQuotation()"
            >
                ✨ Generate Quotation
            </button>

        </div>

    </div>

</div>


<div class="toast" id="toast"></div>


<script>

/* ===============================
   QUOTATION NUMBER
================================ */

function generateQuoteNumber(){

    const now = new Date();

    const year = now.getFullYear();

    const random =
        Math.floor(10000 + Math.random() * 90000);

    return `PON-${year}-${random}`;

}

document.getElementById("quoteNumber").textContent =
    generateQuoteNumber();


/* ===============================
   PRODUCT ARRAY
================================ */

let products = [];


/* ===============================
   ADD PRODUCT
================================ */

function addProduct(){

    const name =
        document.getElementById("productName").value.trim();

    const quantity =
        Number(document.getElementById("quantity").value);

    const price =
        Number(document.getElementById("price").value);


    if(!name){

        showToast("Please enter product / service name");

        return;
    }


    if(quantity <= 0){

        showToast("Please enter valid quantity");

        return;
    }


    if(price < 0 || isNaN(price)){

        showToast("Please enter valid price");

        return;
    }


    const product = {

        id: Date.now(),

        name: name,

        quantity: quantity,

        price: price,

        total: quantity * price

    };


    products.push(product);


    renderProducts();


    document.getElementById("productName").value = "";

    document.getElementById("quantity").value = 1;

    document.getElementById("price").value = "";

    document.getElementById("productName").focus();

}


/* ===============================
   ENTER KEY
================================ */

function handleEnter(event){

    if(event.key === "Enter"){

        event.preventDefault();

        addProduct();

    }

}


/* ===============================
   DISPLAY PRODUCTS
================================ */

function renderProducts(){

    const list =
        document.getElementById("productList");


    if(products.length === 0){

        list.innerHTML = `

            <div class="empty">

                No products added yet.<br>

                Type any product or service above.

            </div>

        `;

        calculateTotal();

        return;

    }


    list.innerHTML = "";


    products.forEach(product => {

        const row = document.createElement("div");

        row.className = "product-row";


        row.innerHTML = `

            <div class="product-name">

                ${escapeHTML(product.name)}

            </div>

            <div class="product-qty">

                ${product.quantity}

            </div>

            <div class="product-price">

                ₹ ${product.price.toFixed(2)}

            </div>

            <div class="product-total">

                ₹ ${product.total.toFixed(2)}

            </div>

            <button
                class="delete-btn"
                onclick="deleteProduct(${product.id})"
            >

                ×

            </button>

        `;


        list.appendChild(row);

    });


    calculateTotal();

}


/* ===============================
   DELETE
================================ */

function deleteProduct(id){

    products =
        products.filter(product => product.id !== id);

    renderProducts();

}


/* ===============================
   CALCULATE TOTAL
================================ */

function calculateTotal(){

    let subtotal = 0;


    products.forEach(product => {

        subtotal += product.total;

    });


    const gstRate =
        Number(document.getElementById("gst").value) || 0;


    const gstAmount =
        subtotal * gstRate / 100;


    const grandTotal =
        subtotal + gstAmount;


    document.getElementById("subtotal").textContent =
        subtotal.toFixed(2);


    document.getElementById("gstAmount").textContent =
        gstAmount.toFixed(2);


    document.getElementById("grandTotal").textContent =
        grandTotal.toFixed(2);

}


/* ===============================
   SAVE
================================ */

function saveQuotation(){

    const quotation = {

        quotationNumber:
            document.getElementById("quoteNumber").textContent,

        customerName:
            document.getElementById("customerName").value,

        phone:
            document.getElementById("phone").value,

        location:
            document.getElementById("location").value,

        products: products,

        gst:
            document.getElementById("gst").value,

        notes:
            document.getElementById("notes").value,

        total:
            document.getElementById("grandTotal").textContent,

        date:
            new Date().toLocaleString()

    };


    localStorage.setItem(
        quotation.quotationNumber,
        JSON.stringify(quotation)
    );


    showToast("Quotation saved successfully ✓");

}


/* ===============================
   SHARE
================================ */

async function shareQuotation(){

    const quoteNumber =
        document.getElementById("quoteNumber").textContent;


    const customer =
        document.getElementById("customerName").value ||
        "Customer";


    const total =
        document.getElementById("grandTotal").textContent;


    const text =

`PONMANI CCTV
Professional Quotation

Quotation: ${quoteNumber}

Customer: ${customer}

Total Amount: ₹${total}

Thank you for choosing Ponmani CCTV.`;


    if(navigator.share){

        try{

            await navigator.share({

                title:
                    "Ponmani CCTV Quotation",

                text:text

            });

        }catch(error){

            console.log(error);

        }

    }else{

        navigator.clipboard.writeText(text);

        showToast("Quotation details copied ✓");

    }

}


/* ===============================
   GENERATE
================================ */

function generateQuotation(){

    if(products.length === 0){

        showToast("Add at least one product");

        return;

    }


    saveQuotation();


    setTimeout(() => {

        window.print();

    },500);

}


/* ===============================
   TOAST
================================ */

function showToast(message){

    const toast =
        document.getElementById("toast");


    toast.textContent = message;


    toast.classList.add("show");


    setTimeout(() => {

        toast.classList.remove("show");

    },2500);

}


/* ===============================
   SECURITY / HTML ESCAPE
================================ */

function escapeHTML(text){

    const div =
        document.createElement("div");

    div.textContent = text;

    return div.innerHTML;

}

</script>

</body>
</html>
